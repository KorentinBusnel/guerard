<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14281D" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Backyard de Guérard</title>
    <meta name="description" content="Backyard ultra à Guérard (77) : une boucle en forêt, un départ toutes les heures, jusqu'au dernier." />
  </head>
  <body class="min-h-dvh">
    <main>
      <section aria-label="Carte du parcours" class="relative">
        <!-- Position et hauteur en style inline : les utilitaires Tailwind (cascade layer)
             perdraient contre .maplibregl-map { position: relative } → hauteur 0. -->
        <div id="map" style="position: fixed; inset: 0; height: 100dvh; width: 100%"></div>

        <div class="pointer-events-none fixed left-3 top-3 z-10 flex flex-col items-start gap-1.5 sm:left-5 sm:top-5">
          <!-- Incrustation TV (décorative ; l'info clé est dupliquée en texte pour les lecteurs d'écran) -->
          <div id="tv-banner" class="tv flex flex-wrap items-stretch text-[15px] shadow-lg sm:text-lg" aria-hidden="true">
            <span class="bg-maillot px-2.5 py-1.5 text-sapin sm:px-3 sm:py-2" data-tv="name"></span>
            <span class="bg-black/85 px-2.5 py-1.5 text-brume sm:px-3 sm:py-2" data-tv="stats"></span>
          </div>
          <p id="tv-banner-text" class="sr-only"></p>
          <div id="dev-badges" class="tv flex flex-col items-start gap-1 text-xs sm:text-sm"></div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
